<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Sao Môi Giới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f1f5f9;
        }
        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.07);
            transition: all 0.3s ease;
        }
        .btn {
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: white;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(34, 197, 94, 0.4);
        }
        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            animation: modal-pop 0.3s ease-out;
        }
        @keyframes modal-pop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .progress-bar {
            background-color: #e2e8f0;
            border-radius: 9999px;
            overflow: hidden;
            height: 12px;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease-in-out;
        }
        .dialogue-option {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .dialogue-option:hover {
            background-color: #f8fafc;
            border-color: #3b82f6;
        }
        .spin-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <div id="game-container" class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Panel: Player Stats & Skills -->
        <div class="lg:col-span-1 space-y-6">
            <div class="card p-5">
                <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center"><i class="fas fa-user-tie mr-3 text-blue-500"></i>Hồ Sơ Của Bạn</h2>
                <div class="space-y-4">
                    <div>
                        <p class="text-sm font-medium text-slate-500">Cấp Độ</p>
                        <p id="player-level" class="text-2xl font-bold text-slate-900">1</p>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-500">Kinh Nghiệm</p>
                        <div class="progress-bar mt-1">
                            <div id="player-exp-bar" class="progress-bar-fill" style="width: 0%;"></div>
                        </div>
                        <p id="player-exp-text" class="text-xs text-right text-slate-500 mt-1">0 / 100</p>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-500">Hoa Hồng</p>
                        <p id="player-cash" class="text-2xl font-bold text-green-600">$500</p>
                    </div>
                </div>
            </div>

            <div class="card p-5">
                <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center"><i class="fas fa-brain mr-3 text-amber-500"></i>Kỹ Năng</h2>
                <div id="skills-container" class="space-y-4"></div>
            </div>
        </div>

        <!-- Center Panel: Main Game Area -->
        <div id="main-panel" class="lg:col-span-2 card p-6 min-h-[500px] flex flex-col">
            <!-- Content changes based on game stage -->
        </div>

        <!-- Right Panel: Properties List -->
        <div class="lg:col-span-1 card p-5">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center"><i class="fas fa-city mr-3 text-teal-500"></i>Giỏ Hàng BĐS</h2>
            <div id="properties-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-2"></div>
        </div>

    </div>

    <!-- Modal for Deal Outcome -->
    <div id="result-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <div id="result-icon"></div>
            <h3 id="result-title" class="text-3xl font-bold mt-4"></h3>
            <p id="result-message" class="text-slate-600 mt-3 text-lg"></p>
            <div id="result-details" class="text-left bg-slate-50 p-4 rounded-lg mt-6 text-sm space-y-2"></div>
            <button id="close-modal-btn" class="btn btn-primary mt-8">Tiếp Tục</button>
        </div>
    </div>

    <script>
        // --- DATA SETUP ---
        const GAME_DATA = {
            properties: [
                { id: 1, name: 'NOXH An Phú', location: 'Khu Tây', price: 1800, type: 'Căn hộ', segment: 'Nhà ở xã hội', minLevel: 1 },
                { id: 2, name: 'Căn hộ The Standard', location: 'Tỉnh lân cận', price: 2500, type: 'Căn hộ', segment: 'Bình dân', minLevel: 1 },
                { id: 3, name: 'Nhà phố Eco Garden', location: 'Khu Tây', price: 3800, type: 'Nhà phố', segment: 'Bình dân', minLevel: 2 },
                { id: 4, name: 'Căn hộ Saigon Riverside', location: 'Khu Đông', price: 4500, type: 'Căn hộ', segment: 'Trung cấp', minLevel: 2 },
                { id: 5, name: 'Shophouse Lakeview', location: 'Khu Nam', price: 6500, type: 'Shophouse', segment: 'Trung cấp', minLevel: 3 },
                { id: 6, name: 'Biệt thự The Oasis', location: 'Khu Đông', price: 9000, type: 'Biệt thự', segment: 'Cao cấp', minLevel: 4 },
                { id: 7, name: 'Căn hộ The Metropole', location: 'Trung tâm', price: 12000, type: 'Căn hộ', segment: 'Cao cấp', minLevel: 5 },
                { id: 8, name: 'Penthouse The Marq', location: 'Trung tâm', price: 25000, type: 'Penthouse', segment: 'Hạng sang', minLevel: 6 },
                { id: 9, name: 'Biệt thự Grand Marina', location: 'Trung tâm', price: 40000, type: 'Biệt thự', segment: 'Hàng hiệu', minLevel: 7 },
            ],
            clientData: {
                names: ['Anh Khoa', 'Chị Mai', 'Cô Bảy', 'Chú Nam', 'Bạn Hùng', 'Chị Trúc'],
                needs: ['Để ở', 'Đầu tư'],
                financials: ['100% vốn tự có', 'Vay ngân hàng 50%'],
                incomes: [30, 50, 80, 120, 200],
            },
            // NEW SPIN-based Dialogue System
            dialogue: {
                'Để ở': {
                    S: {
                        prompt: "Chào anh/chị, em gọi để hỗ trợ mình tìm một mái ấm. Hiện tại gia đình mình đang sinh sống ở khu vực nào ạ?",
                        options: [
                            { text: "Hỏi về số thành viên và công việc để hiểu rõ hơn về nhu cầu di chuyển.", rapport: 10 },
                            { text: "Giới thiệu ngay một dự án đang hot.", rapport: -5 },
                            { text: "Hỏi về ngân sách dự kiến của anh/chị.", rapport: 5 },
                        ]
                    },
                    P: {
                        prompt: "Với nơi ở hiện tại, anh/chị có cảm thấy có điều gì bất tiện không ạ, ví dụ như không gian hơi chật chội hay thiếu tiện ích cho gia đình?",
                        options: [
                            { text: "Lắng nghe và gợi mở thêm về vấn đề an ninh hoặc môi trường sống.", rapport: 15 },
                            { text: "Kể về các tiện ích của dự án bên em.", rapport: 0 },
                            { text: "Nói rằng ai cũng có vấn đề như vậy.", rapport: -10 },
                        ]
                    },
                    I: {
                        prompt: "Việc không gian sống không đủ tiện nghi hoặc an ninh không đảm bảo có thể ảnh hưởng đến chất lượng cuộc sống và sự phát triển của bọn trẻ về lâu dài. Anh/chị có nghĩ vậy không?",
                        options: [
                            { text: "Đồng cảm và nhấn mạnh về tầm quan trọng của một môi trường sống lý tưởng.", rapport: 15 },
                            { text: "So sánh trực tiếp với dự án của mình.", rapport: 5 },
                            { text: "Hỏi khi nào anh/chị quyết định đổi nhà.", rapport: -5 },
                        ]
                    },
                    N: {
                        prompt: "Nếu có một giải pháp nhà ở vừa rộng rãi, an ninh 24/7, lại gần trường học quốc tế, điều đó sẽ giúp anh/chị an tâm và nâng cao chất lượng sống của cả gia đình như thế nào ạ?",
                        options: [
                            { text: "Dẫn dắt khách hàng tự nói ra lợi ích, sau đó mời họ tham quan nhà mẫu để trải nghiệm thực tế.", rapport: 20 },
                            { text: "Liệt kê tất cả các lợi ích của dự án.", rapport: 10 },
                        ]
                    }
                },
                'Đầu tư': {
                    S: {
                        prompt: "Chào anh/chị, em biết mình là một nhà đầu tư có kinh nghiệm. Không biết khẩu vị đầu tư của mình hiện tại đang tập trung vào khu vực nào và phân khúc tài chính ra sao ạ?",
                        options: [
                            { text: "Hỏi thêm về các kênh đầu tư khác và tỷ suất lợi nhuận kỳ vọng.", rapport: 15 },
                            { text: "Giới thiệu ngay dự án có tỷ suất lợi nhuận cao nhất.", rapport: 0 },
                            { text: "Hỏi anh/chị có bao nhiêu tiền để đầu tư.", rapport: -10 },
                        ]
                    },
                    P: {
                        prompt: "Khi tìm kiếm các cơ hội đầu tư BĐS, điều gì khiến anh/chị lo ngại nhất ạ? Có phải là vấn đề về pháp lý, uy tín chủ đầu tư hay tính thanh khoản không ạ?",
                        options: [
                            { text: "Lắng nghe và xác nhận lại mối lo ngại chính của họ.", rapport: 15 },
                            { text: "Cam kết dự án của em không có vấn đề gì.", rapport: 5 },
                            { text: "Hỏi sao anh/chị lại lo xa vậy.", rapport: -15 },
                        ]
                    },
                    I: {
                        prompt: "Với tình hình lạm phát và các kênh đầu tư khác đang biến động, việc bỏ lỡ một cơ hội đầu tư BĐS đúng thời điểm ở một khu vực tiềm năng như Thủ Thiêm có thể ảnh hưởng đến hiệu quả sử dụng vốn của mình như thế nào ạ?",
                         options: [
                            { text: "Phân tích về chi phí cơ hội và tiềm năng tăng giá trong tương lai dựa trên quy hoạch hạ tầng.", rapport: 15 },
                            { text: "Nói rằng nếu không mua bây giờ thì sẽ không còn hàng.", rapport: 5 },
                        ]
                    },
                    N: {
                        prompt: "Nếu bên em có một sản phẩm đảm bảo cả về pháp lý, tiềm năng tăng giá 30-40% trong 3 năm tới và tính thanh khoản cao do vị trí độc tôn, điều đó có phù hợp với mục tiêu đầu tư của anh/chị không?",
                        options: [
                            { text: "Cung cấp số liệu cụ thể và mời khách hàng một buổi trao đổi chuyên sâu với chuyên gia.", rapport: 20 },
                            { text: "Gửi cho khách hàng bảng giá và chính sách bán hàng.", rapport: 10 },
                        ]
                    }
                }
            }
        };

        // --- GAME STATE ---
        let gameState = {
            player: {
                level: 1, exp: 0, cash: 500,
                skills: {
                    giaoTiep: { name: 'Giao Tiếp', level: 1, cost: 100, icon: 'fa-comments' },
                    damPhan: { name: 'Đàm Phán', level: 1, cost: 150, icon: 'fa-handshake' },
                    marketing: { name: 'Marketing', level: 1, cost: 120, icon: 'fa-bullhorn' },
                    amHieu: { name: 'Am Hiểu Thị Trường', level: 1, cost: 200, icon: 'fa-magnifying-glass-chart' }
                }
            },
            journey: {
                stage: 'IDLE', // IDLE, DIALOGUE, PROPOSAL, RESULT
                client: null,
                spinStage: 'S', // S, P, I, N
                rapport: 0,
                selectedPropertyId: null,
            },
            expToNextLevel: 100,
        };

        // --- SOUNDS & UI ELEMENTS (unchanged) ---
        const synth = new Tone.Synth().toDestination();
        const successSound = () => synth.triggerAttackRelease("C5", "8n", Tone.now());
        const failureSound = () => synth.triggerAttackRelease("C3", "8n", Tone.now());
        const upgradeSound = () => new Tone.PolySynth().toDestination().triggerAttackRelease(["C4", "E4", "G4"], "8n");
        const levelUpSound = () => new Tone.PolySynth().toDestination().triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n");
        const playerLevelEl = document.getElementById('player-level'), playerExpBarEl = document.getElementById('player-exp-bar'), playerExpTextEl = document.getElementById('player-exp-text'), playerCashEl = document.getElementById('player-cash'), skillsContainerEl = document.getElementById('skills-container'), mainPanelEl = document.getElementById('main-panel'), propertiesListEl = document.getElementById('properties-list'), resultModalEl = document.getElementById('result-modal');


        // --- RENDER FUNCTIONS ---
        function formatCurrency(value) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value * 1000000);
        }

        function updatePlayerUI() {
            playerLevelEl.textContent = gameState.player.level;
            playerCashEl.textContent = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(gameState.player.cash);
            const expPercent = (gameState.player.exp / gameState.expToNextLevel) * 100;
            playerExpBarEl.style.width = `${expPercent}%`;
            playerExpTextEl.textContent = `${gameState.player.exp} / ${gameState.expToNextLevel} EXP`;
        }

        function updateSkillsUI() {
            skillsContainerEl.innerHTML = '';
            for (const key in gameState.player.skills) {
                const skill = gameState.player.skills[key];
                const canAfford = gameState.player.cash >= skill.cost;
                skillsContainerEl.innerHTML += `
                    <div class="flex items-center justify-between">
                        <div><p class="font-semibold text-slate-700 flex items-center"><i class="fas ${skill.icon} mr-2 text-slate-500 w-4"></i>${skill.name}</p><p class="text-sm text-slate-500">Cấp ${skill.level}</p></div>
                        <button class="btn bg-slate-200 text-slate-700 hover:bg-slate-300 text-xs px-3 py-2 ${canAfford ? '' : 'disabled'}" onclick="upgradeSkill('${key}')" ${canAfford ? '' : 'disabled'}>+ ${new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(skill.cost)}</button>
                    </div>`;
            }
        }

        function updatePropertiesUI() {
            propertiesListEl.innerHTML = '';
            GAME_DATA.properties.forEach(prop => {
                const isLocked = prop.minLevel > gameState.player.level;
                const isSelected = gameState.journey.selectedPropertyId === prop.id;
                const canSelect = gameState.journey.stage === 'PROPOSAL' && !isLocked;
                propertiesListEl.innerHTML += `
                    <div class="card p-3 border-2 ${isSelected ? 'border-blue-500' : 'border-transparent'} ${isLocked ? 'opacity-50' : (canSelect ? 'cursor-pointer' : '')}" onclick="${canSelect ? `selectProperty(${prop.id})` : ''}">
                        <div class="flex items-start">
                            <i class="fas fa-building text-xl mr-4 text-teal-600 w-6 text-center pt-1"></i>
                            <div><p class="font-semibold text-slate-800">${prop.name}</p><p class="text-sm text-slate-500">${prop.location} - ${prop.segment}</p><p class="text-sm text-green-600 font-medium">${formatCurrency(prop.price)}</p>${isLocked ? `<p class="text-xs text-red-500 font-semibold">Yêu cầu Cấp ${prop.minLevel}</p>` : ''}</div>
                        </div>
                    </div>`;
            });
        }

        function updateMainPanelUI() {
            const journey = gameState.journey;
            if (journey.stage === 'IDLE') {
                mainPanelEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center">
                        <i class="fas fa-search-dollar text-6xl text-slate-300 mb-4"></i>
                        <h2 class="text-2xl font-bold text-slate-700">Sẵn sàng chinh phục khách hàng?</h2>
                        <p class="text-slate-500 mt-2 mb-6 max-w-sm">Sử dụng kỹ năng Marketing để tìm kiếm khách hàng tiềm năng và bắt đầu hành trình của bạn.</p>
                        <button class="btn btn-primary" onclick="startJourney()"><i class="fas fa-search mr-2"></i>Tìm Khách Hàng Mới</button>
                    </div>`;
            } else if (journey.stage === 'DIALOGUE') {
                const dialogueData = GAME_DATA.dialogue[journey.client.need][journey.spinStage];
                const spinInfo = {
                    S: { name: 'Tình huống', color: 'bg-blue-100 text-blue-800' },
                    P: { name: 'Vấn đề', color: 'bg-amber-100 text-amber-800' },
                    I: { name: 'Ảnh hưởng', color: 'bg-red-100 text-red-800' },
                    N: { name: 'Nhu cầu-Lợi ích', color: 'bg-green-100 text-green-800' },
                };
                mainPanelEl.innerHTML = `
                    <div class="flex flex-col h-full">
                        <div class="text-center mb-6">
                            <p class="text-sm text-slate-500">Hành trình khách hàng: <span class="spin-tag ${spinInfo[journey.spinStage].color}">${journey.spinStage} - ${spinInfo[journey.spinStage].name}</span></p>
                            <h2 class="text-2xl font-bold text-slate-800">Tiếp Cận & Phân Tích</h2>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-lg mb-6">
                            <p class="font-semibold text-slate-800">Khách hàng nói:</p>
                            <p class="text-lg text-slate-700 italic">"${dialogueData.prompt}"</p>
                        </div>
                        <div class="space-y-3 flex-grow overflow-y-auto pr-2">
                            ${dialogueData.options.map((opt, index) => `
                                <div class="dialogue-option" onclick="handleDialogueChoice(${index})"><p>${opt.text}</p></div>
                            `).join('')}
                        </div>
                    </div>`;
            } else if (journey.stage === 'PROPOSAL') {
                const client = journey.client;
                mainPanelEl.innerHTML = `
                    <div class="flex flex-col h-full">
                        <div class="text-center mb-6"><p class="text-sm text-slate-500">Hành trình khách hàng: Bước 3/7</p><h2 class="text-2xl font-bold text-slate-800">Tư Vấn Sản Phẩm</h2></div>
                        <div class="card bg-slate-50 p-4 space-y-2 flex-grow">
                            <h3 class="text-lg font-bold text-slate-700">Hồ Sơ Khách Hàng: ${client.name}</h3>
                            <p><strong>Nhu cầu chính:</strong> <span class="font-semibold text-blue-600">${client.need}</span></p>
                            <p><strong>Tài chính:</strong> <span class="font-semibold text-blue-600">${client.financial}</span></p>
                            <p><strong>Thu nhập:</strong> <span class="font-semibold text-blue-600">~${client.income} triệu/tháng</span></p>
                            <p><strong>Thiện cảm:</strong> <span class="font-semibold text-green-600">${journey.rapport}/100</span></p>
                        </div>
                        <div class="mt-6 text-center">
                            <p class="text-slate-600 mb-4">Dựa vào thông tin trên, hãy chọn sản phẩm phù hợp nhất từ giỏ hàng bên phải.</p>
                            <button id="attempt-deal-btn" class="btn btn-success disabled" onclick="attemptDeal()" disabled><i class="fas fa-file-signature mr-2"></i>Chốt Deal</button>
                        </div>
                    </div>`;
            }
        }
        
        function updateAllUI() {
            updatePlayerUI();
            updateSkillsUI();
            updatePropertiesUI();
            updateMainPanelUI();
        }

        // --- GAME LOGIC ---
        function upgradeSkill(key) {
            const skill = gameState.player.skills[key];
            if (gameState.player.cash >= skill.cost) {
                gameState.player.cash -= skill.cost;
                skill.level++;
                skill.cost = Math.round(skill.cost * 1.6);
                upgradeSound();
                updateAllUI();
            }
        }

        function addExp(amount) {
            gameState.player.exp += amount;
            while (gameState.player.exp >= gameState.expToNextLevel) {
                gameState.player.exp -= gameState.expToNextLevel;
                gameState.player.level++;
                gameState.expToNextLevel = Math.round(gameState.expToNextLevel * 1.6);
                levelUpSound();
            }
        }

        function startJourney() {
            const { names, needs, financials, incomes } = GAME_DATA.clientData;
            gameState.journey.client = {
                name: names[Math.floor(Math.random() * names.length)],
                need: needs[Math.floor(Math.random() * needs.length)],
                financial: financials[Math.floor(Math.random() * financials.length)],
                income: incomes[Math.floor(Math.random() * incomes.length)],
                emotionalFactor: Math.floor(Math.random() * 41) - 20 
            };
            
            gameState.journey.stage = 'DIALOGUE';
            gameState.journey.spinStage = 'S';
            gameState.journey.rapport = 20; // Start with some base rapport
            gameState.journey.selectedPropertyId = null;
            
            updateAllUI();
        }

        function handleDialogueChoice(choiceIndex) {
            const journey = gameState.journey;
            const dialogueData = GAME_DATA.dialogue[journey.client.need][journey.spinStage];
            const choice = dialogueData.options[choiceIndex];

            journey.rapport += choice.rapport;

            const stageOrder = ['S', 'P', 'I', 'N'];
            const currentStageIndex = stageOrder.indexOf(journey.spinStage);

            if (currentStageIndex < stageOrder.length - 1) {
                journey.spinStage = stageOrder[currentStageIndex + 1];
            } else {
                journey.stage = 'PROPOSAL';
            }
            updateAllUI();
        }

        function selectProperty(propId) {
            if (gameState.journey.stage !== 'PROPOSAL') return;
            gameState.journey.selectedPropertyId = propId;
            updatePropertiesUI();
            
            const dealBtn = document.getElementById('attempt-deal-btn');
            if (dealBtn) { dealBtn.classList.remove('disabled'); dealBtn.disabled = false; }
        }
        
        function attemptDeal() {
            const client = gameState.journey.client;
            const prop = GAME_DATA.properties.find(p => p.id === gameState.journey.selectedPropertyId);
            const skills = gameState.player.skills;
            let details = {};
            
            let matchingScore = 0;
            const priceAffordable = client.income * 70 > prop.price; // Stricter check
            if (priceAffordable) {
                matchingScore += 20;
                details['Tài chính'] = { text: 'Phù hợp', value: '+20%', success: true };
            } else {
                matchingScore -= 15;
                details['Tài chính'] = { text: 'Vượt ngân sách', value: '-15%', success: false };
            }
            
            const segmentMatchBonus = (client.need === 'Để ở' && prop.type !== 'Shophouse') || (client.need === 'Đầu tư');
            if (segmentMatchBonus) {
                matchingScore += 20;
                details['Loại hình'] = { text: 'Đúng nhu cầu', value: '+20%', success: true };
            } else {
                details['Loại hình'] = { text: 'Chưa tối ưu', value: '+0%', success: true };
            }
            details['Điểm phù hợp'] = { text: `Tổng cộng`, value: `${matchingScore}%`, success: matchingScore > 0 };

            const skillBonus = (skills.giaoTiep.level) + (skills.damPhan.level * 2) + (skills.amHieu.level * 2);
            details['Kỹ năng'] = { text: `Giao tiếp, Đàm phán...`, value: `+${skillBonus}%`, success: true };

            const rapportBonus = Math.round(gameState.journey.rapport / 4); // Rapport from dialogue
            details['Thiện cảm (SPIN)'] = { text: `Qua đối thoại`, value: `+${rapportBonus}%`, success: true };
            
            const emotionalFactor = client.emotionalFactor;
            details['Cảm tính khách hàng'] = { text: `Yếu tố bất ngờ`, value: `${emotionalFactor > 0 ? '+' : ''}${emotionalFactor}%`, success: emotionalFactor >= 0 };

            const successChance = Math.max(5, Math.min(95, matchingScore + skillBonus + rapportBonus + emotionalFactor));
            const roll = Math.random() * 100;
            const isSuccess = roll < successChance;

            details['Tỷ lệ thành công'] = { text: `(Cần ${successChance.toFixed(0)}%)`, value: `Bạn đã quay được ${roll.toFixed(0)}%`, success: isSuccess };
            
            let title, message, icon;
            if (isSuccess) {
                const commission = Math.round(prop.price * 0.02);
                const expGained = Math.round(prop.price / 10);
                gameState.player.cash += commission;
                addExp(expGained);
                successSound();
                title = "CHỐT DEAL THÀNH CÔNG!";
                message = `Bạn đã thuyết phục được ${client.name} mua ${prop.name}. Bạn nhận được ${new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(commission)} hoa hồng và ${expGained} EXP.`;
                icon = `<i class="fas fa-check-circle text-7xl text-green-500"></i>`;
            } else {
                const expGained = 50;
                addExp(expGained);
                failureSound();
                title = "THƯƠNG VỤ THẤT BẠI!";
                message = `Rất tiếc, ${client.name} đã từ chối. Bạn nhận được ${expGained} EXP an ủi. Hãy phân tích lại và đừng nản lòng!`;
                icon = `<i class="fas fa-times-circle text-7xl text-red-500"></i>`;
            }
            showResultModal(title, message, icon, details);
        }

        function showResultModal(title, message, icon, details) {
            resultModalEl.classList.remove('hidden');
            document.getElementById('result-title').textContent = title;
            document.getElementById('result-message').textContent = message;
            document.getElementById('result-icon').innerHTML = icon;
            const detailsEl = document.getElementById('result-details');
            detailsEl.innerHTML = `<h4 class="font-bold text-slate-600 mb-2">Phân tích thương vụ:</h4>`;
            for(const key in details) {
                const detail = details[key];
                detailsEl.innerHTML += `<div class="flex justify-between items-center"><span>${key}: <span class="text-slate-500">${detail.text}</span></span><span class="font-bold ${detail.success ? 'text-green-600' : 'text-red-600'}">${detail.value}</span></div>`;
            }
        }

        function closeModal() {
            resultModalEl.classList.add('hidden');
            gameState.journey.stage = 'IDLE';
            updateAllUI();
        }

        // --- INITIALIZE ---
        document.addEventListener('DOMContentLoaded', () => {
            updateAllUI();
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        });
    </script>
</body>
</html>
