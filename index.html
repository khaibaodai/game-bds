<html lang="vi">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            min-height: 100vh;
        }
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }
        .glass-effect {
            background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        .card {
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); }
        .btn {
            border-radius: 15px; padding: 14px 28px; font-weight: 700;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer;
            border: none; display: inline-flex; align-items: center; justify-content: center;
            text-transform: uppercase; letter-spacing: 0.8px; position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn:hover::before { left: 100%; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }
        .modal-backdrop {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            animation: fadeIn 0.4s ease;
        }
        .modal-content {
            background: linear-gradient(135deg, #ffffff, #f8fafc); color: #1e293b;
            padding: 3rem; border-radius: 25px; width: 95%; max-width: 650px; text-align: center;
            animation: modal-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modal-pop { from { transform: scale(0.7) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .progress-bar { background: #e2e8f0; border-radius: 9999px; height: 8px; overflow: hidden; }
        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2); height: 100%;
            border-radius: 9999px; transition: width 0.5s ease;
        }
        .dialogue-bubble {
            border-radius: 20px; padding: 1rem 1.5rem; margin: 0.5rem 0;
            position: relative; animation: fadeInUp 0.5s ease; max-width: 85%;
        }
        .dialogue-bubble.customer { background: #e0f2fe; color: #0c4a6e; margin-left: auto; }
        .dialogue-bubble.agent { background: #f1f5f9; color: #1e293b; margin-right: auto; }
        .dialogue-option {
            background: white; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 1rem 1.5rem; cursor: pointer; transition: all 0.3s ease; text-align: left;
        }
        .dialogue-option:hover {
            border-color: #667eea; transform: translateX(8px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }
        .mood-indicator { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
        .mood-happy { color: #10b981; } .mood-neutral { color: #f59e0b; } .mood-unhappy { color: #ef4444; }
        .property-card {
            background: white; border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); transition: all 0.3s ease;
            cursor: pointer; border: 3px solid transparent;
        }
        .property-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); }
        .property-card.selected { border-color: #667eea; transform: translateY(-5px); }
        .property-tag {
            display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
        }
        .typing-indicator { display: inline-flex; align-items: center; gap: 4px; }
        .typing-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #667eea;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        function drawCustomerChart() {
            const ctx = document.getElementById('customerChart').getContext('2d');
            const persona = gameState.journey.persona;
            const data = {
                labels: ['Vị trí', 'Giá', 'Tiện ích', 'Không gian', 'Sinh lời', 'An ninh'],
                datasets: [{
                    label: 'Mức độ ưu tiên',
                    data: [
                        persona.locationPriority === 'gần trung tâm' ? 9 : 5,
                        persona.budget === '< 3 tỷ' ? 9 : 6,
                        persona.amenities === 'tiện ích 5 sao' ? 8 : 4,
                        persona.painPoint === 'Không gian' ? 9 : 5,
                        persona.purpose?.includes('Đầu tư') ? 9 : 4,
                        persona.painPoint === 'Môi trường' ? 8 : 5
                    ],
                    backgroundColor: 'rgba(167, 139, 250, 0.2)',
                    borderColor: 'rgba(167, 139, 250, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(167, 139, 250, 1)',
                }]
            };
            if (customerChart) customerChart.destroy();
            customerChart = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    responsive: true, maintainAspectRatio: true,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },

                            ticks: { display: false, beginAtZero: true, max: 10, backdropColor: 'transparent' }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- GAME LOGIC ---
        function initGameState() {
            const savedState = localStorage.getItem('sieuSaoMoiGioiV3');
            if (savedState) {
                gameState = JSON.parse(savedState);
                if (!gameState.player.skills.psychology) {
                    gameState.player.skills.psychology = { name: 'Tâm Lý Học', level: 1, cost: 180, icon: 'fa-brain' };
                }
            } else {
                gameState = {
                    player: { level: 1, exp: 0, cash: 500, skills: { communication: { name: 'Giao Tiếp', level: 1, cost: 100, icon: 'fa-comments' }, negotiation: { name: 'Đàm Phán', level: 1, cost: 150, icon: 'fa-handshake' }, marketing: { name: 'Marketing', level: 1, cost: 120, icon: 'fa-bullhorn' }, analysis: { name: 'Phân Tích', level: 1, cost: 200, icon: 'fa-chart-line' }, psychology: { name: 'Tâm Lý Học', level: 1, cost: 180, icon: 'fa-brain' } } },
                    stats: { totalDeals: 0, successfulDeals: 0, successRate: 0, currentStreak: 0, maxStreak: 0, totalEarnings: 0 },
                    journey: { stage: 'IDLE' },
                    achievements: {},
                    expToNextLevel: 100,
                };
            }
        }

        function saveGame() {
            localStorage.setItem('sieuSaoMoiGioiV3', JSON.stringify(gameState));
        }

        function addExp(amount) {
            const oldLevel = gameState.player.level;
            gameState.player.exp += Math.round(amount);
            while (gameState.player.exp >= gameState.expToNextLevel) {
                gameState.player.exp -= gameState.expToNextLevel;
                gameState.player.level++;
                gameState.expToNextLevel = Math.round(gameState.expToNextLevel * 1.8);
            }
            if (gameState.player.level > oldLevel) {
                showLevelUpModal(gameState.player.level);
            }
            updatePlayerProfilePanel();
        }

        function upgradeSkill(key) {
            const skill = gameState.player.skills[key];
            if (gameState.player.cash >= skill.cost) {
                gameState.player.cash -= skill.cost;
                skill.level++;
                skill.cost = Math.round(skill.cost * 1.6);
                sounds.success.triggerAttackRelease("E5", "8n");
                showNotification(`${skill.name} đã được nâng lên cấp ${skill.level}!`);
                updateSkillsPanel();
                updatePlayerProfilePanel();
                checkAchievements();
            }
        }

        function startJourney() {
            sounds.click.triggerAttackRelease("C2", "8n");
            gameState.journey = {
                stage: 'DISCOVERY',
                client: { name: GAME_DATA.clientData.names[Math.floor(Math.random() * GAME_DATA.clientData.names.length)], emotionalFactor: Math.floor(Math.random() * 41) - 20 },
                currentQuestionId: 'q1', persona: {}, insightPoints: 0, selectedPropertyId: null,
            };
            updateAllUI();
        }

        function handleDialogueChoice(choiceIndex) {
            sounds.click.triggerAttackRelease("C3", "8n");
            const journey = gameState.journey;
            const question = GAME_DATA.questionBank.find(q => q.id === journey.currentQuestionId);
            const answer = question.answers[choiceIndex];
            if (answer.persona) { journey.persona[answer.persona.key] = answer.persona.value; journey.insightPoints += 10; }
            if (answer.next === 'END') {
                journey.stage = 'ANALYSIS';
                setTimeout(() => {
                    journey.stage = 'PROPOSAL';
                    updateAllUI();
                }, 2500);
            } else {
                journey.currentQuestionId = answer.next;
            }
            updateAllUI();
        }

        function selectProperty(propId) {
            sounds.click.triggerAttackRelease("C3", "8n");
            if (gameState.journey.stage !== 'PROPOSAL') return;
            gameState.journey.selectedPropertyId = propId;
            updateMainGameArea();
        }

        function attemptDeal() {
            const persona = gameState.journey.persona;
            const prop = GAME_DATA.properties.find(p => p.id === gameState.journey.selectedPropertyId);
            const skills = gameState.player.skills;
            let matchingScore = 0;

            if (persona.propertyType === prop.type) matchingScore += 15;
            if (persona.status === prop.status) matchingScore += 15;
            if (persona.budget && prop.segment) {
                const budgetRanges = { '< 3 tỷ': ['Nhà ở xã hội', 'Bình dân'], '3-7 tỷ': ['Bình dân', 'Trung cấp'], '7-15 tỷ': ['Cao cấp'], '> 15 tỷ': ['Hạng sang', 'Hàng hiệu'] };
                if (budgetRanges[persona.budget]?.includes(prop.segment)) matchingScore += 10;
            }
            prop.features.forEach(feature => { if (Object.values(persona).includes(feature)) { matchingScore += 5; } });
            
            const skillBonus = (skills.communication.level) + (skills.negotiation.level * 2) + (skills.analysis.level * 2) + (skills.psychology.level * 1.5);
            const insightBonus = Math.round(gameState.journey.insightPoints / 5);
            const emotionalFactor = gameState.journey.client.emotionalFactor;

            const successChance = Math.max(5, Math.min(95, matchingScore + skillBonus + insightBonus + emotionalFactor));
            const isSuccess = Math.random() * 100 < successChance;
            
            gameState.stats.totalDeals++;
            if(isSuccess) {
                const commission = Math.round(prop.price * 0.02 * 1000);
                const expGained = Math.round(prop.price / 10);
                gameState.player.cash += commission;
                addExp(expGained);
                gameState.stats.successfulDeals++;
                gameState.stats.currentStreak++;
                gameState.stats.maxStreak = Math.max(gameState.stats.maxStreak, gameState.stats.currentStreak);
                gameState.stats.totalEarnings += commission;
                sounds.success.triggerAttackRelease("C5", "8n");
                showResultModal(true, commission, expGained, successChance);
            } else {
                const expGained = 50;
                addExp(expGained);
                gameState.stats.currentStreak = 0;
                sounds.failure.triggerAttackRelease("C3", "4n");
                showResultModal(false, 0, expGained, successChance);
            }
            gameState.stats.successRate = gameState.stats.successfulDeals / gameState.stats.totalDeals;
            checkAchievements();
        }
        
        // --- MODAL & NOTIFICATION FUNCTIONS ---
        function showResultModal(isSuccess, commission, expGain, successChance) {
            const title = isSuccess ? 'CHỐT DEAL THÀNH CÔNG!' : 'THƯƠNG VỤ THẤT BẠI!';
            const icon = isSuccess ? 'fa-check-circle text-green-400' : 'fa-times-circle text-red-400';
            const message = isSuccess ? `Bạn nhận được ${formatCurrency(commission)} hoa hồng và ${expGain} EXP.` : `Bạn nhận được ${expGain} EXP an ủi.`;
            if (isSuccess) confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

            el('result-modal').innerHTML = `<div class="modal-content">
                <i class="fas ${icon} text-8xl mb-6"></i>
                <h3 class="text-3xl font-bold mb-4">${title}</h3>
                <p class="text-slate-300 text-lg mb-6">${message}</p>
                <div class="glass-card p-4 mb-6 text-left text-sm space-y-2">
                    <div class="flex justify-between items-center font-bold"><span class="text-slate-300">Tỷ lệ thành công</span><span class="text-purple-400">${Math.round(successChance)}%</span></div>
                </div>
                <button class="btn btn-primary text-lg px-8 py-4" onclick="closeModal('result-modal')">Tiếp Tục</button>
            </div>`;
            el('result-modal').classList.remove('hidden');
        }

        function showLevelUpModal(newLevel) {
            const newRank = GAME_DATA.ranks.slice().reverse().find(r => newLevel >= r.level);
            sounds.levelup.triggerAttackRelease(["C4", "E4", "G4", "C5"], "1n");
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });
            el('levelup-modal').innerHTML = `<div class="modal-content">
                <i class="fas fa-arrow-up-right-dots text-8xl text-yellow-400"></i>
                <h3 class="text-4xl font-extrabold mt-4 text-purple-400">THĂNG CẤP!</h3>
                <p class="text-slate-300 mt-3 text-lg">Bạn đã đạt đến cấp độ ${newLevel}!</p>
                <div class="mt-6">
                    <p class="text-slate-400">Danh hiệu mới của bạn là:</p>
                    <div class="level-badge text-xl inline-flex mt-2 ${newRank.color}">${newRank.name}</div>
                </div>
                <button class="btn btn-primary mt-8" onclick="closeModal('levelup-modal')">Tuyệt vời!</button>
            </div>`;
            el('levelup-modal').classList.remove('hidden');
        }

        function checkAchievements() {
            GAME_DATA.achievements.forEach(achievement => {
                if (!gameState.achievements[achievement.id] && achievement.condition(gameState.stats, gameState.player)) {
                    gameState.achievements[achievement.id] = true;
                    showNotification(`Thành tựu mới: ${achievement.name}!`);
                }
            });
        }

        function closeModal(modalId) {
            el(modalId).classList.add('hidden');
            if (modalId === 'result-modal') {
                gameState.journey.stage = 'IDLE';
                updateAllUI();
            }
        }

        function switchTab(tabName) {
            sounds.click.triggerAttackRelease("C4", "8n");
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            el(`${tabName}-tab`).classList.remove('hidden');
            if(tabName === 'achievements') updateAchievementsPanel();
            if(tabName === 'guide') updateGuidePanel();
        }

        function updateAllUI() {
            updatePlayerProfilePanel();
            updateSkillsPanel();
            updateMainGameArea();
            updateContextPanel();
            saveGame();
        }

        // --- INITIALIZATION ---
        function initGame() {
            particlesJS('particles-js', { particles: { number: { value: 50 }, color: { value: '#ffffff' }, shape: { type: 'circle' }, opacity: { value: 0.1, random: true }, size: { value: 3, random: true }, line_linked: { enable: false }, move: { enable: true, speed: 1, direction: 'none', random: true, straight: false, out_mode: 'out' } }, interactivity: { detect_on: 'canvas', events: { onhover: { enable: false }, onclick: { enable: false } } } });
            initGameState();
            updateAllUI();
        }

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
